name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Every coding problem's Python reference must agree with the JS one
      # (in real Pyodide), and problems.json must be regenerated after edits.
      - run: npm run coding:generate -- --check
      - run: git diff --exit-code src/modules/coding/content/problems.json

  postgres:
    name: Unit tests and e2e on PostgreSQL + Better Auth
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prepstack
          POSTGRES_PASSWORD: prepstack
          POSTGRES_DB: prepstack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prepstack" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://prepstack:prepstack@localhost:5432/prepstack_test
      E2E_DATABASE_URL: postgres://prepstack:prepstack@localhost:5432/prepstack_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: PGPASSWORD=prepstack psql -h localhost -U prepstack -d prepstack_test -c "create database prepstack_e2e"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: prepstack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
