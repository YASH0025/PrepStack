# Single-node deployment: the app plus a tiny scheduler that triggers
# reminders and other jobs every 5 minutes. Secrets come from .env.
services:
  app:
    build: .
    image: prepstack:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "3000:3000"
    volumes:
      - prepstack-data:/app/data

  cron:
    image: prepstack:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    environment:
      APP_URL: http://app:3000
    command: ["node", "scripts/cron.mjs", "--watch=5"]

volumes:
  prepstack-data:
